# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem acesso
# (aconteceu em out/2026: login, CSAT e aprovação ficaram fora do ar).
# Uma leitura leve a cada 2 dias conta como uso e mantém o banco ligado.
# Se falhar, o GitHub manda e-mail: sinal de que o projeto pausou e precisa
# de "Restore project" no painel do Supabase.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: "17 11 */2 * *"   # a cada 2 dias, 08:17 em São Paulo
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leitura leve no banco (chave pública, só lê as perguntas do CSAT)
        env:
          URL: https://qgyiuhdyqaxpqhkzgbmq.supabase.co/rest/v1/perguntas?select=id&limit=1
          KEY: sb_publishable_itIfz5BmcGJ0eUqBO3G5Pg_dQGu0NjJ
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do Supabase: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::O Supabase não respondeu. Provavelmente o projeto pausou: abra supabase.com/dashboard e clique em Restore project."
            exit 1
          fi
